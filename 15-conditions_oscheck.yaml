- name: check the os family 
  hosts: local
  connection: local
  tasks:
   - name: install nginx if the os is redhat 
     ansible.builtin.package:
      name: nginx 
      state: present
     when: ansible_os_family == 'RedHat' 
   - name: install nginx in debian 
     ansible.builtin.package:
      name: nginx
      state: present
     when:  ansible_os_family == 'Debian' 