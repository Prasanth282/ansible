- name: conditions 
  hosts: local
  connection: local
  vars:
   NUMBER: 10
  tasks:
   - name: print the number if grater than 10 
     ansible.builtin.debug:
      msg: " the number is graterthan 10" 
     when: NUMBER > 10
   - name: print the number if less than 10
     ansible.builtin.debug:
      msg: " the number is less than 10"
     when: NUMBER < 10 
   - name: printb the number if equal to 10
     ansible.builtin.debug:
      msg: " the number is equal to 10'
     when: NUMBER = 10